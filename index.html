<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fórum UPB | Relevo generacional</title>
    <link rel="stylesheet" href="./styles.css?v=grammar-2" />
  </head>
  <body>
    <main class="stage-shell" aria-label="Experiencia TED Talk Fórum UPB">
      <section class="stage" id="stage">
        <canvas id="visual-canvas" aria-hidden="true"></canvas>

        <div class="grain" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>

        <div class="brand-lockup" aria-label="UPB Forum y Universidad Pontificia Bolivariana 90 años">
          <img class="brand-logo brand-logo-forum" src="./assets/brand-forum.png" alt="UPB Fórum Centro de Eventos" />
          <span class="brand-divider" aria-hidden="true"></span>
          <img class="brand-logo brand-logo-upb90" src="./assets/brand-upb90-lockup.png" alt="UPB 90 años 1936-2026" />
        </div>

        <section class="copy-layer" aria-live="polite">
          <p class="eyebrow" id="moment-kicker">Future Leaders Forum · Fórum UPB</p>
          <h1 id="moment-title"></h1>
          <p class="subtitle" id="moment-subtitle"></p>
        </section>

        <figure class="moment-asset" id="moment-asset" aria-hidden="true">
          <img id="moment-image" alt="" />
        </figure>

        <aside class="qr-layer" id="qr-layer" aria-label="Códigos QR de cierre">
          <div class="qr-block">
            <div class="qr-code" id="qr-memory" aria-hidden="true"></div>
            <span>Memorias</span>
          </div>
          <div class="qr-block">
            <div class="qr-code" id="qr-social" aria-hidden="true"></div>
            <span>@centrodeeventosupb</span>
          </div>
        </aside>

        <nav class="operator-ui" id="operator-ui" aria-label="Controles de operacion">
          <button class="icon-button" id="prev-button" type="button" aria-label="Momento anterior" title="Anterior">
            <span aria-hidden="true">‹</span>
          </button>
          <div class="counter" aria-label="Momento actual">
            <span id="moment-number">01</span>
            <span>/</span>
            <span id="moment-total">13</span>
          </div>
          <button class="icon-button" id="next-button" type="button" aria-label="Siguiente momento" title="Siguiente">
            <span aria-hidden="true">›</span>
          </button>
          <button class="icon-button" id="fullscreen-button" type="button" aria-label="Pantalla completa" title="Pantalla completa">
            <span aria-hidden="true">⛶</span>
          </button>
        </nav>

        <div class="help-panel" id="help-panel">
          <span>Espacio / → avanzar</span>
          <span>← volver</span>
          <span>F fullscreen</span>
          <span>H ayuda</span>
          <span>R reiniciar</span>
          <div class="language-switch" aria-label="Idioma">
            <button type="button" data-language="es">ES</button>
            <button type="button" data-language="pt">PT</button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./main.js?v=grammar-2"></script>
  </body>
</html>
